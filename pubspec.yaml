name: histoires_du_soir
description: "Histoires du Soir : des histoires du soir personnalisées pour les enfants."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  purchases_flutter: ^11.0.4
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/launcher/icon.png
  adaptive_icon_background: assets/launcher/background.png
  adaptive_icon_foreground: assets/launcher/foreground.png

flutter_native_splash:
  color: "#0B0B2B"
  image: assets/images/mascot.png
  android_12:
    color: "#0B0B2B"
    image: assets/launcher/splash_android12.png
